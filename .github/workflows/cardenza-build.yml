name: Cardenza build
on:
  push:
    branches: [main, nightly]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cardenza-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cardenza:
    if: github.repository == 'Cardenza-Community/M5Tuna'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container: espressif/idf:v5.5.1
    env:
      PLATFORMIO_CORE_DIR: /tmp/203-launcher-pio
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: recursive

      - name: Build and check Cardenza support
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py -B build-cardenza -D CARDENZA=ON -D SDKCONFIG=sdkconfig.cardenza build
      - name: Prepare app-only image and licensing notices
        run: python3 .github/launcher/prepare.py build-cardenza/M5Tuna.bin main/pitch_detector_task.cpp main/pitch_detector_task.h main/defines.h
      - name: Files for the author to attach to a Release
        uses: actions/upload-artifact@v4
        with:
          name: Cardenza
          include-hidden-files: true
          path: |
            .git/launcher-output/Cardenza.bin
            .git/launcher-output/NOTICES.txt
